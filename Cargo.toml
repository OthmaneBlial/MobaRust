[workspace]
members = [
  "crates/mobarust-core",
  "crates/mobarust-ssh",
  "crates/mobarust-store",
  "crates/mobarust-vault",
  "crates/mobarust-remote-desktop",
  "apps/desktop/src-tauri",
  "xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/OthmaneBlial/MobaRust"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.18", features = ["serde", "v4"] }
anyhow = "1.0"
russh = { version = "0.63.1", default-features = true }
russh-sftp = "2.4.0"
tokio = { version = "1.47", features = ["fs", "io-util", "net", "process", "rt-multi-thread", "sync", "time"] }
zeroize = "1.8"
