[workspace]
members = [
  "benchmarks",
  "crates/mobarust-core",
  "crates/mobarust-ssh",
  "crates/mobarust-store",
  "crates/mobarust-vault",
  "crates/mobarust-remote-desktop",
  "crates/mobarust-telnet",
  "crates/mobarust-serial",
  "crates/mobarust-network",
  "apps/desktop/src-tauri",
  "xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/OthmaneBlial/MobaRust"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
uuid = { version = "1.18", features = ["serde", "v4"] }
anyhow = "1.0"
encoding_rs = "0.8"
russh = { version = "0.63.1", default-features = true }
russh-sftp = "2.4.0"
serialport = { version = "4.7", default-features = false }
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
zeroize = "1.8"
