<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MobaRust social card source</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="styles.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  .og { position: relative; width: 1200px; height: 630px; box-sizing: border-box; padding: 56px 64px; display: grid; grid-template-columns: 1fr 360px; gap: 40px; align-items: end; }
  .og .wall-code { position: absolute; top: 48px; left: 64px; right: 64px; }
  .og .wall-title { font-size: 7.4rem; margin: 0 0 22px; }
  .og p.lead { margin: 0; font-size: 1.7rem; line-height: 1.3; color: var(--paper); max-width: 34rem; }
  .og .tag { background: var(--paper); color: var(--ink); padding: 28px; border-radius: 3px; box-shadow: 0 30px 60px -30px rgba(0,0,0,.8); }
  .og .tag b { display: block; font: 400 6rem/0.9 var(--stencil); }
  .og .tag span { display: block; margin-top: 14px; font: 600 .95rem/1.4 var(--mono); letter-spacing: .12em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="og steel">
    <p class="wall-code"><span>MBRU 001402 · 22G1</span><span>mobarust</span></p>
    <div>
      <h1 class="wall-title">Ship your whole <span>fleet.</span></h1>
      <p class="lead">A free MobaXterm alternative for your Mac. SSH, SFTP, tunnels and one-click server groups.</p>
    </div>
    <div class="tag"><b>€0</b><span>Free · open source<br>macOS · Linux · Windows</span></div>
  </div>
</body>
</html>
