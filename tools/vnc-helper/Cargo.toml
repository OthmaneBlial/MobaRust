[workspace]
resolver = "2"

[package]
name = "mobarust-vnc-helper"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[dependencies]
jpeg-decoder = { version = "0.3.2", default-features = false, features = ["platform_independent"] }
mobarust-remote-desktop = { path = "../../crates/mobarust-remote-desktop" }
tokio = { version = "1.47", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
vnc-rs = "0.5.3"
zeroize = "1.8"

[dev-dependencies]
base64 = "0.22"
des = "0.9.0"
