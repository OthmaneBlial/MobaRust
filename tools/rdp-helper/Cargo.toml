[workspace]
resolver = "2"

[package]
name = "mobarust-rdp-helper"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[dependencies]
ironrdp-client = { version = "0.1.0", default-features = false, features = ["clipboard", "gateway", "rustls"] }
ironrdp-tls = { path = "ironrdp-tls-validated", features = ["rustls"] }
ironrdp-connector = "0.10.0"
ironrdp-pdu = "0.9.0"
mobarust-remote-desktop = { path = "../../crates/mobarust-remote-desktop" }
smallvec = "1.15"
tokio = { version = "1.47", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
zeroize = "1.9"

[patch.crates-io]
ironrdp-tls = { path = "ironrdp-tls-validated" }
