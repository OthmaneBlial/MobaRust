name: Quality

on:
  workflow_dispatch:

# Disabled on GitHub at the maintainer's request. No push/PR triggers;
# retain this recipe for explicitly authorized future manual validation.

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-15, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: '10.15.0'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target
            tools/vnc-helper -> target
      - name: Linux native and OpenSSH lab dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev openssh-server xauth zsh fish
          sudo mkdir -p /run/sshd
      - name: macOS OpenSSH X11 fixture dependency
        if: runner.os == 'macOS'
        run: brew install xauth
      - name: Frontend and release asset checks
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm test:unit
          pnpm check
          pnpm lint
          pnpm build
          node --test ../../tools/release-assets.test.mjs
      - name: Rust workspace checks and native fixtures
        run: cargo xtask check-rust

# Experimental helpers, fuzzing, installers, signing and GUI/hardware testing
# remain separate gates. This workflow never creates a release.
